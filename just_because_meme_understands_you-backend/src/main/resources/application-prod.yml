# =============================================================================
# application-prod.yml —— 生产环境覆盖（SPRING_PROFILES_ACTIVE=prod）
#
# 职责：
#   只调整生产安全开关的默认倾向，不写任何真实密钥。
#   数据库 / Redis / 邮箱 / OSS / JWT 等仍由环境变量注入到 application.yml。
#
# 启动示例：
#   java -jar app.jar --spring.profiles.active=prod
#   或 Docker：SPRING_PROFILES_ACTIVE=prod + 根目录 .env（见 .env.example）
# =============================================================================

jwt:
  # HTTPS 下默认给 refresh cookie 加 Secure；可用 JWT_COOKIE_SECURE=false 覆盖
  cookie-secure: ${JWT_COOKIE_SECURE:true}

app:
  security:
    headers:
      # 生产默认开启 HSTS；纯 HTTP 临时环境可设 HSTS_ENABLED=false
      hsts-enabled: ${HSTS_ENABLED:true}
  cors:
    # 必须显式配置正式前端域名，例如 https://www.example.com
    # 多个用英文逗号分隔；缺省会导致启动失败（避免误放开）
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
