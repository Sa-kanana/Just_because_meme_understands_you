# =============================================================================
# application.yml —— 公共配置（所有环境都会加载）
#
# 职责：
#   1. 放各环境共用的业务默认值（限流、连接池、过期时间等）
#   2. 敏感项只写 ${环境变量}，不写真实密码 / JWT / OSS Key
#
# 生效规则：
#   - 本地：spring.profiles.default=dev → 自动叠加载 application-dev.yml
#   - 生产 / Docker：SPRING_PROFILES_ACTIVE=prod → 叠加载 application-prod.yml
#                   敏感项必须由环境变量（或 .env）注入
#
# 语法说明：
#   ${NAME}        必须提供，缺了会启动失败（适合密钥）
#   ${NAME:默认}   有默认值；未设置环境变量时用冒号后的值
# =============================================================================

server:
  # HTTP 端口，可用 SERVER_PORT 覆盖
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  config:
    # 支持从后端模块目录或仓库根目录启动；系统环境变量仍可覆盖 .env。
    import:
      - optional:file:./.env[.properties]
      - optional:file:./just_because_meme_understands_you-backend/.env[.properties]
  application:
    name: just_because_meme_understands_you

  profiles:
    # 未显式指定 profile 时默认走开发配置；上线务必设 SPRING_PROFILES_ACTIVE=prod
    default: dev

  servlet:
    multipart:
      # 知识文件单份上限为 25 MB；阈值高于上限，上传正文只在受限内存中暂存。
      file-size-threshold: 26MB
      # 中文注释：单个上传请求的最大文件体积。
      max-file-size: ${KNOWLEDGE_UPLOAD_MAX_FILE_SIZE:25MB}
      # 中文注释：为 multipart 边界和表单字段预留 1 MB 请求开销。
      max-request-size: 26MB

  # ---------- 邮箱（验证码 / 找回密码）----------
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    # 开发由 application-dev.yml 覆盖；生产由 MAIL_USERNAME / MAIL_PASSWORD 注入
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          # QQ 邮箱 SMTP 需开启 SSL
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

  # ---------- MySQL ----------
  # 无弱默认值：开发写在 application-dev.yml，生产必须设 DB_* 环境变量
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    hikari:
      # 知识库等 DATETIME 字段按中国标准时间写入，避免 MySQL 自动更新时间使用 UTC。
      connection-init-sql: "SET time_zone = '+08:00'"
      # 连接最大存活时间（毫秒），建议小于 MySQL wait_timeout
      max-lifetime: 1800000
      # 空闲连接保留时间（毫秒）
      idle-timeout: 600000
      # 取出连接前探活
      connection-test-query: SELECT 1

  # ---------- 数据库版本迁移 ----------
  flyway:
    # 启动时校验并应用尚未执行的数据库版本迁移
    enabled: true
    # 首次接入已有非空 schema 时自动记录初始基线
    baseline-on-migrate: true
    # mysql.sql 代表的既有 schema 基线；后续版本号必须大于该值
    baseline-version: "20261003"
    # 仅扫描专用迁移目录，避免把 mysql.sql 和种子数据当成版本迁移
    locations: classpath:db/migration
    # 启动时校验历史迁移文件校验和
    validate-on-migrate: true

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 10
# ---------- Redisson（分布式锁 / 限流 / Pub-Sub）----------
redisson:
  singleServerConfig:
    address: redis://${REDIS_HOST}:${REDIS_PORT}
    connect-timeout: 10000
    timeout: 3000
    retry-attempts: 3
    retry-interval: 1500
    connection-pool-size: 32
    connection-minimum-idle-size: 8
    subscription-connection-pool-size: 16
    subscription-connection-minimum-idle-size: 4
    idle-connection-timeout: 10000
    keep-alive: true
    tcp-no-delay: true
  threads: 16
  netty-threads: 32

# ---------- 阿里云 OSS（上传 / 读图）----------
oss:
  # 地域 Endpoint，可按桶所在区域修改
  endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
  accessKeyId: ${OSS_ACCESS_KEY_ID}
  accessKeySecret: ${OSS_ACCESS_KEY_SECRET}
  bucketName: ${OSS_BUCKET_NAME}
  # PostObject 上传域名；空则默认 https://{bucket}.{endpoint}
  uploadHost: ${OSS_UPLOAD_HOST:}
  # 对外读图域名；生产建议填 CDN
  publicBaseUrl: ${OSS_PUBLIC_BASE_URL:}
  # 申请上传凭证限流：每用户每 IP 每分钟次数
  policy-rate-limit-per-minute: ${OSS_POLICY_RATE_LIMIT_PER_MINUTE:10}
  # ---------- 文件资产清理 ----------
  cleanup:
    # 是否启用 OSS 延迟清理定时任务。
    enabled: ${OSS_CLEANUP_ENABLED:true}
    # 每轮最多领取的 OSS 删除任务数。
    batch-size: ${OSS_CLEANUP_BATCH_SIZE:100}
    # Worker 两轮轮询之间的间隔，单位为毫秒。
    poll-interval-ms: ${OSS_CLEANUP_POLL_INTERVAL_MS:60000}
    # 最后一个业务引用释放后等待删除的天数。
    deletion-delay-days: ${OSS_CLEANUP_DELETION_DELAY_DAYS:2}
    # 单个对象最多安排的 OSS 删除重试次数。
    max-retries: ${OSS_CLEANUP_MAX_RETRIES:5}
    # Worker 领取任务后的租约时长，单位为秒。
    lease-seconds: ${OSS_CLEANUP_LEASE_SECONDS:300}
    # 是否运行历史文件引用回填；关闭时 OSS 物理删除门禁保持关闭。
    backfill-enabled: ${OSS_BACKFILL_ENABLED:true}
    # 每个历史数据源每轮读取的最大记录数。
    backfill-batch-size: ${OSS_BACKFILL_BATCH_SIZE:200}
    # 历史数据源回填批次之间的间隔，单位为毫秒。
    backfill-poll-interval-ms: ${OSS_BACKFILL_POLL_INTERVAL_MS:1000}
    # 多实例共享的历史回填租约时长，单位为秒。
    backfill-lease-seconds: ${OSS_BACKFILL_LEASE_SECONDS:300}
    # 每日执行过期TEMP资产检查的Cron表达式。
    temp-cleanup-cron: '${OSS_TEMP_CLEANUP_CRON:0 0 3 * * *}'
    # 多实例部署时的当前 Worker 唯一标识；默认由应用启动时生成。
    worker-id: ${OSS_CLEANUP_WORKER_ID:}
    # 未确认上传资产保留天数，超时后进入删除队列。
    temp-asset-ttl-days: ${OSS_TEMP_ASSET_TTL_DAYS:3}
    # 孤儿对象进入复查阶段前要求的最短观察天数。
    orphan-review-days: ${OSS_ORPHAN_REVIEW_DAYS:7}
    # 孤儿对账默认仅登记候选，不创建物理删除任务。
    reconcile-dry-run: ${OSS_RECONCILE_DRY_RUN:true}
    # 是否启用每日OSS孤儿对象扫描；首次部署默认关闭。
    reconcile-enabled: ${OSS_RECONCILE_ENABLED:false}
    # 每日OSS孤儿对象扫描的Cron表达式。
    reconcile-cron: '${OSS_RECONCILE_CRON:0 30 3 * * *}'
    # OSS ListObjects每页读取的最多对象数，上限1000。
    reconcile-page-size: ${OSS_RECONCILE_PAGE_SIZE:500}
    # 孤儿对账实际扫描的业务对象前缀；仍受下方删除白名单约束。
    reconcile-prefixes:
      - tmp/ # 临时上传文件。
      - avatar/ # 用户头像。
      - memes/ # 梗图及媒体。
      - comments/ # 评论图片。
      # 首页和公共目录可由未登记链接引用，默认不参与孤儿自动删除。
    # Worker 可以删除的业务对象前缀白名单。
    allowed-prefixes:
      - tmp/ # 直传产生的临时文件。
      - avatar/ # 用户头像。
      - memes/ # 梗图及其媒体。
      - comments/ # 评论图片。
      - home/ # 首页运营图片。
      - common/ # 项目公共图片。
    # 无论其他配置如何都禁止删除的系统对象前缀。
    protected-prefixes:
      - system/ # 系统级静态资源。
      - homepage/static/ # 首页静态资源。

# ---------- JWT ----------
jwt:
  # 签名密钥，至少 32 字节；生产必须用环境变量换掉开发值
  secret: ${JWT_SECRET}
  # access token 过期（毫秒），默认 2 小时
  expiration: ${JWT_EXPIRATION:7200000}
  # refresh token 过期（毫秒），默认 7 天
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  # 是否给 refresh cookie 加 Secure；HTTPS 生产见 application-prod.yml
  cookie-secure: ${JWT_COOKIE_SECURE:false}

# ---------- 登录 / 刷新限流 ----------
auth:
  # 刷新接口 QPS（按 IP + refresh 指纹）
  refresh-qps-limit: 5
  # 单 IP 每分钟登录次数上限
  login-rate-limit-per-minute: 10
  # 连续失败几次后锁定账号
  login-lockout-after-failures: 5
  # 锁定时长（分钟）
  login-lockout-minutes: 15
  # 首次初始化 SUPER_ADMIN 的已有邮箱；未配置时不自动提升任何账号
  bootstrap-super-admin-email: ${AUTH_BOOTSTRAP_SUPER_ADMIN_EMAIL:}

# ---------- 安全头 / CORS / 反代 / 反馈 ----------
app:
  security:
    headers:
      # 是否附加安全响应头
      enabled: ${SECURITY_HEADERS_ENABLED:true}
      # HSTS（强制 HTTPS）；本地 HTTP 应关闭，生产见 prod 配置
      hsts-enabled: ${HSTS_ENABLED:false}
  cors:
    enabled: ${CORS_ENABLED:true}
    # 允许的前端 Origin（逗号分隔）；生产必须改成正式域名
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://127.0.0.1,http://localhost:5174,http://127.0.0.1:5174}
    # Origin 模式（支持 *）。内网穿透示例：https://*.cpolar.cn,https://*.cpolar.top,https://*.ngrok-free.app
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  feedback:
    # 运营收件邮箱
    to-email: ${FEEDBACK_TO_EMAIL:827278063@qq.com}
    rate-limit-per-minute: ${FEEDBACK_RATE_LIMIT_PER_MINUTE:3}
  oauth:
    github:
      # GitHub OAuth App Client ID / Secret（勿提交真实值）
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      # 须与 GitHub 应用「Authorization callback URL」完全一致
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/v1/auth/oauth/github/callbacks}
      # 授权成功后浏览器跳转的前端页
      frontend-callback-url: ${GITHUB_FRONTEND_CALLBACK_URL:http://localhost/login/oauth/callback}
      scope: ${GITHUB_OAUTH_SCOPE:read:user user:email}

# ---------- 业务参数 ----------
user-favorite:
  # 收藏计数 Redis → DB 回写间隔（毫秒）
  count-sync-interval-ms: 120000

user:
  follow:
    # 单用户关注/取关每分钟上限
    rate-limit-per-minute: 60

meme-comment:
  # 评论事务提交后由本地线程池处理用户活跃度奖励。
  async:
    # 评论事务提交后的异步奖励线程数。
    core-pool-size: 4
    # 评论事务提交后的异步奖励线程池最大线程数。
    max-pool-size: 16
    # 异步奖励任务队列容量，满载时由调用线程执行以避免丢弃。
    queue-capacity: 500

meme:
  # 彻底删除冷静期（天），0 表示不限制
  purge-cooldown-days: 0
  # 风控申诉连续驳回次数上限，达上限永久封禁
  appeal-reject-max: 3
  view:
    # 同一访客对同一梗浏览去重窗口（小时）
    dedup-hours: 24
    # 浏览上报限流：每访客每分钟次数
    report-rate-limit-per-minute: 30
  agent:
    # FastAPI MemeAgent 内网地址（生产用环境变量覆盖）
    base-url: ${MEME_AGENT_BASE_URL:http://127.0.0.1:8000}
    api-key: ${MEME_AGENT_API_KEY:}
    # 写密钥：ingest/crawl；空则回退 api-key
    write-api-key: ${MEME_AGENT_WRITE_API_KEY:}
    connect-timeout-ms: ${MEME_AGENT_CONNECT_TIMEOUT_MS:2000}
    # MemeAgent 知识向量入库可能较慢，默认响应读取超时为 20 分钟；可由环境变量覆盖。
    response-timeout-ms: ${MEME_AGENT_RESPONSE_TIMEOUT_MS:1200000}
    # AI 流式上游连接池最大活跃连接数，按 MemeAgent 可承载并发调整
    max-connections: ${MEME_AGENT_MAX_CONNECTIONS:100}
    # 上游连接池排队上限，达到上限后新请求在配置等待时间后失败
    pending-acquire-max-count: ${MEME_AGENT_PENDING_ACQUIRE_MAX_COUNT:200}
    # 等待上游连接池可用连接的最长毫秒数
    pending-acquire-timeout-ms: ${MEME_AGENT_PENDING_ACQUIRE_TIMEOUT_MS:10000}
    stream-path: /stream
    ingest-path: /ingest
    knowledge-ingest-path: /ingest/knowledge
    # 中文注释：知识索引 outbox 的并行 worker 数，范围 1–8，默认 2。
    knowledge-index-concurrency: ${MEME_AGENT_KNOWLEDGE_INDEX_CONCURRENCY:2}
    # 逐条 enrichment 可能较慢，建议 >=600000
    crawl-path: /crawl/hot-memes
  ai:
    max-history-tokens: ${MEME_AI_MAX_HISTORY_TOKENS:3000}
    max-output-tokens: ${MEME_AI_MAX_OUTPUT_TOKENS:512}
    cache-ttl-seconds: ${MEME_AI_CACHE_TTL_SECONDS:120}
    # 只作用于 AI SSE 相邻事件的空闲看门狗；不影响 crawl/ingest 的 WebClient 超时
    stream-idle-timeout-ms: ${MEME_AI_STREAM_IDLE_TIMEOUT_MS:130000}
    # 后台 AI 流式任务和事件的保留时间（秒），默认十分钟
    task-ttl-seconds: ${MEME_AI_TASK_TTL_SECONDS:600}
    rate-limit-per-minute: ${MEME_AI_RATE_LIMIT_PER_MINUTE:20}
    chars-per-token-estimate: ${MEME_AI_CHARS_PER_TOKEN:3}
  crawl:
    enabled: ${MEME_CRAWL_ENABLED:true}
    schedule-enabled: ${MEME_CRAWL_SCHEDULE_ENABLED:true}
    # 每月 4 次：1/8/15/22 日 10:00（Firecrawl 交互抓投稿前 5 条）
    cron: '${MEME_CRAWL_CRON:0 0 10 1,8,15,22 * *}'
    limit: ${MEME_CRAWL_LIMIT:5}
    publisher-user-id: ${MEME_CRAWL_PUBLISHER_USER_ID:0}
    live-limit: ${MEME_CRAWL_LIVE_LIMIT:8}
    live-hours: ${MEME_CRAWL_LIVE_HOURS:48}

# 管理员知识文件上传的内存与解析边界。
knowledge:
  upload:
    # 中文注释：单文件最大字节数；默认 25 MiB，需与 multipart 限制一致。
    max-file-size: ${KNOWLEDGE_UPLOAD_MAX_FILE_SIZE:25MB}
    # 中文注释：允许提取的正文最大字符数；超限时拒绝，不静默截断。
    max-content-chars: ${KNOWLEDGE_UPLOAD_MAX_CONTENT_CHARS:1000000}
    # 中文注释：同一实例同时解析的 multipart 请求数，默认 2，限制知识 PDF 等上传的峰值内存。
    max-concurrent-requests: ${KNOWLEDGE_UPLOAD_MAX_CONCURRENT_REQUESTS:2}
    # 中文注释：等待上传解析槽位的最长时间；超时返回繁忙错误。
    admission-wait-ms: ${KNOWLEDGE_UPLOAD_ADMISSION_WAIT_MS:30000}
