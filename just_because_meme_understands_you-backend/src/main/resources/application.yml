server:
  port: 8080

#应用名
spring:
  application:
    name: just_because_meme_understands_you
  #邮箱验证配置
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME} # QQ邮箱
    password: ${MAIL_PASSWORD}  # qq邮箱16位授权码
    default-encoding: UTF-8
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          # 关键配置：QQ邮箱必须开启 SSL
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
  #mysql数据库配置
  datasource:
    password: 1234
    username: root
    url: jdbc:mysql://192.168.100.128:3306/MemeLIst?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    # hikari数据库连接池配置
    hikari:
      # 设置为 30 分钟
      max-lifetime: 1800000
      # 连接在池中保持空闲的最长时间
      idle-timeout: 600000
      # 建议配置，确保连接在取出时是活的
      connection-test-query: SELECT 1
  data:
    redis:
      host: 192.168.100.128
      port: 6379
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20 # 针对你提到的“高并发”模式进行扩展
          max-wait: -1ms
          max-idle: 10
# 阿里云OSS配置
oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  accessKeyId: ${OSS_ACCESS_KEY_ID}
  accessKeySecret: ${OSS_ACCESS_KEY_SECRET}
  bucketName: ${OSS_BUCKET_NAME}
  # 上传直连接口（PostObject），不配置则默认为 https://{bucketName}.{endpoint}
  uploadHost: ${OSS_UPLOAD_HOST:}
  # 读图访问域名：开发用 OSS 域名，生产改为 CDN 域名（如 https://img.example.com）
  publicBaseUrl: ${OSS_PUBLIC_BASE_URL:}
  # 上传凭证 /oss/policy 限流：每用户每 IP 每分钟最多次数
  policy-rate-limit-per-minute: 10

jwt:
  # 注意：生产环境请使用更复杂且保密的密钥字符串，长度至少 32 字节
  secret: "just_because_meme_understands_you_jwt_secret_2026"
  # access token 过期时间：2 小时
  expiration: 7200000
  # refresh token 过期时间：7 天
  refresh-expiration: 604800000
  # 本地开发可为 false，生产环境建议 true（需 HTTPS）
  cookie-secure: false

auth:
  # 刷新接口每秒允许请求次数（按 IP + refresh token 指纹限流）
  refresh-qps-limit: 5

user-favorite:
  # 收藏总数 Redis -> DB 同步间隔（毫秒）
  count-sync-interval-ms: 120000

meme-comment:
  # Redis 评论计数 -> meme.comments 批量回写间隔（毫秒）
  count-sync-interval-ms: 120000
  async:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 500

meme:
  # 下架后允许恢复的天数
  restore-days: 30
  # 下架后允许彻底删除的冷静期（天），0 表示不限制
  purge-cooldown-days: 0
  view:
    # 同一访客对同一梗的去重窗口（小时）
    dedup-hours: 24
    # 浏览上报限流：每访客每分钟最多次数
    report-rate-limit-per-minute: 30
