# =============================================================================
# application.yml —— 公共配置（所有环境都会加载）
#
# 职责：
#   1. 放各环境共用的业务默认值（限流、连接池、过期时间等）
#   2. 敏感项只写 ${环境变量}，不写真实密码 / JWT / OSS Key
#
# 生效规则：
#   - 本地：spring.profiles.default=dev → 自动叠加载 application-dev.yml
#   - 生产 / Docker：SPRING_PROFILES_ACTIVE=prod → 叠加载 application-prod.yml
#                   敏感项必须由环境变量（或 .env）注入
#
# 语法说明：
#   ${NAME}        必须提供，缺了会启动失败（适合密钥）
#   ${NAME:默认}   有默认值；未设置环境变量时用冒号后的值
# =============================================================================

server:
  # HTTP 端口，可用 SERVER_PORT 覆盖
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: just_because_meme_understands_you

  profiles:
    # 未显式指定 profile 时默认走开发配置；上线务必设 SPRING_PROFILES_ACTIVE=prod
    default: dev

  # ---------- 邮箱（验证码 / 找回密码）----------
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    # 开发由 application-dev.yml 覆盖；生产由 MAIL_USERNAME / MAIL_PASSWORD 注入
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          # QQ 邮箱 SMTP 需开启 SSL
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

  # ---------- MySQL ----------
  # 无弱默认值：开发写在 application-dev.yml，生产必须设 DB_* 环境变量
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    hikari:
      # 连接最大存活时间（毫秒），建议小于 MySQL wait_timeout
      max-lifetime: 1800000
      # 空闲连接保留时间（毫秒）
      idle-timeout: 600000
      # 取出连接前探活
      connection-test-query: SELECT 1

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      # 无密码可留空；有密码设 REDIS_PASSWORD 或在 dev 文件中填写
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 10

# ---------- 阿里云 OSS（上传 / 读图）----------
oss:
  # 地域 Endpoint，可按桶所在区域修改
  endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
  accessKeyId: ${OSS_ACCESS_KEY_ID}
  accessKeySecret: ${OSS_ACCESS_KEY_SECRET}
  bucketName: ${OSS_BUCKET_NAME}
  # PostObject 上传域名；空则默认 https://{bucket}.{endpoint}
  uploadHost: ${OSS_UPLOAD_HOST:}
  # 对外读图域名；生产建议填 CDN
  publicBaseUrl: ${OSS_PUBLIC_BASE_URL:}
  # 申请上传凭证限流：每用户每 IP 每分钟次数
  policy-rate-limit-per-minute: 10

# ---------- JWT ----------
jwt:
  # 签名密钥，至少 32 字节；生产必须用环境变量换掉开发值
  secret: ${JWT_SECRET}
  # access token 过期（毫秒），默认 2 小时
  expiration: ${JWT_EXPIRATION:7200000}
  # refresh token 过期（毫秒），默认 7 天
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  # 是否给 refresh cookie 加 Secure；HTTPS 生产见 application-prod.yml
  cookie-secure: ${JWT_COOKIE_SECURE:false}

# ---------- 登录 / 刷新限流 ----------
auth:
  # 刷新接口 QPS（按 IP + refresh 指纹）
  refresh-qps-limit: 5
  # 单 IP 每分钟登录次数上限
  login-rate-limit-per-minute: 10
  # 连续失败几次后锁定账号
  login-lockout-after-failures: 5
  # 锁定时长（分钟）
  login-lockout-minutes: 15

# ---------- 安全头 / CORS / 反代 ----------
app:
  security:
    # 可信反向代理 IP（逗号分隔）；仅来自这些 IP 时才信任 X-Forwarded-For
    trusted-proxies: ${TRUSTED_PROXIES:}
    headers:
      # 是否附加安全响应头
      enabled: ${SECURITY_HEADERS_ENABLED:true}
      # HSTS（强制 HTTPS）；本地 HTTP 应关闭，生产见 prod 配置
      hsts-enabled: ${HSTS_ENABLED:false}
  cors:
    enabled: ${CORS_ENABLED:true}
    # 允许的前端 Origin（逗号分隔）；生产必须改成正式域名
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://127.0.0.1}

# ---------- 业务参数 ----------
user-favorite:
  # 收藏计数 Redis → DB 回写间隔（毫秒）
  count-sync-interval-ms: 120000

user:
  follow:
    # 单用户关注/取关每分钟上限
    rate-limit-per-minute: 60

meme-comment:
  # 评论计数 Redis → meme.comments 回写间隔（毫秒）
  count-sync-interval-ms: 120000
  async:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 500

meme:
  # 下架后可恢复天数
  restore-days: 30
  # 彻底删除冷静期（天），0 表示不限制
  purge-cooldown-days: 0
  view:
    # 同一访客对同一梗浏览去重窗口（小时）
    dedup-hours: 24
    # 浏览上报限流：每访客每分钟次数
    report-rate-limit-per-minute: 30
  agent:
    # FastAPI MemeAgent 内网地址（生产用环境变量覆盖）
    base-url: ${MEME_AGENT_BASE_URL:http://127.0.0.1:8000}
    api-key: ${MEME_AGENT_API_KEY:}
    connect-timeout-ms: ${MEME_AGENT_CONNECT_TIMEOUT_MS:2000}
    response-timeout-ms: ${MEME_AGENT_RESPONSE_TIMEOUT_MS:60000}
    stream-path: /stream
    ingest-path: /ingest
  ai:
    max-history-tokens: ${MEME_AI_MAX_HISTORY_TOKENS:3000}
    max-output-tokens: ${MEME_AI_MAX_OUTPUT_TOKENS:512}
    cache-ttl-seconds: ${MEME_AI_CACHE_TTL_SECONDS:120}
    rate-limit-per-minute: ${MEME_AI_RATE_LIMIT_PER_MINUTE:20}
    chars-per-token-estimate: ${MEME_AI_CHARS_PER_TOKEN:3}
