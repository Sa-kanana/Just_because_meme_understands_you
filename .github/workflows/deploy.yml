# 通过 GitHub Actions 手动连接服务器并执行 Docker Compose 部署。
name: Docker Compose 部署 # 工作流在 GitHub Actions 页面显示的名称

# 从 Actions 页面手动选择要部署的远程分支。
on:
  workflow_dispatch: # 仅在维护者手动运行时部署
    inputs:
      ref: # 服务器需要拉取的 Git 分支
        description: 要部署的 Git 分支 # 提示操作者输入部署版本
        required: true # 必须明确部署的代码版本
        default: main # 默认部署主分支
        type: string # 输入使用普通文本框

# 本工作流不读取仓库 API，也不需要 GitHub Token 权限。
permissions: {} # 禁止为 GITHUB_TOKEN 授予额外权限

# 同一时间只运行一个生产部署，避免两个部署同时更新同一目录。
concurrency:
  group: production-deploy # 生产环境部署互斥组
  cancel-in-progress: false # 已开始的部署不因新请求而中断

jobs:
  deploy:
    name: 通过 SSH 部署到服务器 # 部署任务在运行列表显示的名称
    runs-on: ubuntu-latest # 使用 GitHub 托管的 Linux Runner
    timeout-minutes: 30 # 限制 SSH、镜像构建和服务健康检查的最长时间
    steps:
      - name: 校验 SSH 配置并运行服务器部署脚本
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }} # 服务器域名或公网 IP
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }} # 服务器 SSH 登录用户
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }} # SSH 端口，留空时使用 22
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }} # Runner 登录服务器的私钥
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }} # 服务器公钥指纹对应的 known_hosts 内容
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }} # 服务器上的仓库绝对路径
          DEPLOY_REF: ${{ inputs.ref }} # 本次运行选择的分支
        run: | # 固定校验 SSH 主机身份后，在远端更新代码并启动 Compose
          set -Eeuo pipefail

          # 检查 GitHub 仓库必须配置的部署密钥，错误提示不显示密钥值。
          required=(DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_PATH DEPLOY_REF)
          missing=()
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '请在 GitHub Actions Secrets 中配置：%s\n' "${missing[*]}" >&2
            exit 1
          fi

          # 限制分支名字符，避免将工作流输入解释为远端 Shell 命令。
          if [[ ! "$DEPLOY_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo '部署分支名包含不支持的字符。' >&2
            exit 1
          fi

          # 创建仅当前 Runner 可读的 SSH 私钥和主机校验文件。
          install -m 700 -d "$HOME/.ssh"
          key_file="$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          # 以 Shell 转义后的参数传入服务器，避免路径或分支名被拆分执行。
          ssh_port="${DEPLOY_SSH_PORT:-22}"
          printf -v remote_args '%q ' "$DEPLOY_PATH" "$DEPLOY_REF"
          ssh \
            -p "$ssh_port" \
            -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- ${remote_args}" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          # 接收并验证服务器仓库目录和本次部署版本。
          deployment_path="$1"
          deployment_ref="$2"
          if [[ "$deployment_path" != /* || ! -d "$deployment_path/.git" ]]; then
            echo 'DEPLOY_PATH 必须指向服务器上的 Git 仓库绝对路径。' >&2
            exit 1
          fi

          # 保护服务器上仓库的本地改动，避免切换版本时覆盖人工修改。
          if [[ -n "$(git -C "$deployment_path" status --porcelain)" ]]; then
            echo '服务器仓库存在未提交改动，请先清理后再部署。' >&2
            exit 1
          fi

          # 从 origin 获取目标版本，并在服务器上快进更新专用部署工作区。
          git -C "$deployment_path" fetch --prune origin "$deployment_ref"
          if git -C "$deployment_path" show-ref --verify --quiet "refs/heads/$deployment_ref"; then
            git -C "$deployment_path" switch "$deployment_ref"
          else
            git -C "$deployment_path" switch --track -c "$deployment_ref" "origin/$deployment_ref"
          fi
          git -C "$deployment_path" pull --ff-only origin "$deployment_ref"

          # 保留服务器本地环境密钥，只执行项目已有的 Compose 部署脚本。
          cd "$deployment_path/deploy"
          if [[ ! -s .env ]]; then
            echo '服务器 deploy/.env 不存在，请先复制模板并填写生产密钥。' >&2
            exit 1
          fi
          chmod +x deploy.sh
          ./deploy.sh
          REMOTE_SCRIPT
