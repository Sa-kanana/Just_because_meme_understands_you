[project]
name = "meme-agent"
version = "0.1.0"
description = "LangChain + FastAPI agent for meme AI search (internal service)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<0.29",
  "asyncpg>=0.30,<0.31",
  "pgvector>=0.3,<0.4",
  # 与本地 conda memeagent 对齐：AgentExecutor 仍在 langchain.agents（1.x 已迁走）
  "langchain>=0.3.25,<0.4",
  "langchain-core>=0.3.63,<0.4",
  "langchain-openai>=0.2.14,<0.3",
  "langchain-text-splitters>=0.3.8,<0.4",
  "langsmith>=0.2,<0.4",
  "numpy>=2.0,<3",
  "firecrawl-py>=1.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
