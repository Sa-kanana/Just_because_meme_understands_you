openapi: 3.0.3
info:
  title: 只因梗懂你 · 管理端 API
  description: |
    管理端接口（`/admin/**`）及登录、AI 运维相关接口。
    成功响应统一为 `{ code: 1, message, data }`；业务失败抛 BizException，常见 code：0/400/401/403/404。
    鉴权：`Authorization: Bearer <accessToken>`；`/admin/**` 要求 `ROLE_ADMIN`。
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: 本地后端
tags:
  - name: Auth
  - name: AdminMeme
  - name: AdminUser
  - name: AdminHomeImage
  - name: AdminTag
  - name: AdminSensitiveWord
  - name: AdminKnowledge
  - name: AiOps
paths:
  /captcha:
    get:
      tags: [Auth]
      summary: 获取图形验证码
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCaptcha'
  /login:
    post:
      tags: [Auth]
      summary: 管理员登录（复用用户登录）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultLogin'
  /login/refresh:
    post:
      tags: [Auth]
      summary: 刷新 access token（cookie refresh）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultLogin'
  /logout:
    post:
      tags: [Auth]
      summary: 退出登录
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /admin/memes:
    get:
      tags: [AdminMeme]
      summary: 分页查询梗
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: status
          in: query
          schema:
            type: integer
            enum: [1, 2, 3]
        - name: keyword
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminMemePage'
  /admin/memes/{id}:
    get:
      tags: [AdminMeme]
      summary: 梗详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminMemeDetail'
  /admin/memes/{id}/approve:
    post:
      tags: [AdminMeme]
      summary: 审核通过
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminMemeAction'
  /admin/memes/{id}/reject:
    post:
      tags: [AdminMeme]
      summary: 审核拒绝（下架）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminMemeAction'
  /admin/memes/{id}/offline:
    post:
      tags: [AdminMeme]
      summary: 强制下架
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminMemeAction'
  /admin/memes/{id}/online:
    post:
      tags: [AdminMeme]
      summary: 重新提交审核
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminMemeAction'
  /admin/users:
    get:
      tags: [AdminUser]
      summary: 分页查询用户
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1]
        - name: role
          in: query
          schema:
            type: string
            enum: [ROLE_USER, ROLE_ADMIN]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminUserPage'
  /admin/users/{id}/status:
    patch:
      tags: [AdminUser]
      summary: 更新用户状态
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: integer
                  enum: [0, 1]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminUser'
  /admin/users/{id}/role:
    patch:
      tags: [AdminUser]
      summary: 更新用户角色
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [ROLE_USER, ROLE_ADMIN]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminUser'
  /admin/home-images:
    get:
      tags: [AdminHomeImage]
      summary: 分页查询轮播
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminHomeImagePage'
    post:
      tags: [AdminHomeImage]
      summary: 新增轮播
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminHomeImageSaveRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminHomeImage'
  /admin/home-images/{id}:
    put:
      tags: [AdminHomeImage]
      summary: 更新轮播
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminHomeImageSaveRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminHomeImage'
    delete:
      tags: [AdminHomeImage]
      summary: 删除轮播
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
  /admin/home-images/{id}/status:
    patch:
      tags: [AdminHomeImage]
      summary: 上/下线轮播
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: integer
                  enum: [0, 1]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminHomeImage'
  /admin/tags:
    get:
      tags: [AdminTag]
      summary: 分页查询标签
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminTagPage'
    post:
      tags: [AdminTag]
      summary: 新增标签
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTagSaveRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminTag'
  /admin/tags/{id}:
    put:
      tags: [AdminTag]
      summary: 更新标签
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTagSaveRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminTag'
    delete:
      tags: [AdminTag]
      summary: 删除标签（并清理关联）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
  /admin/sensitive-words:
    get:
      tags: [AdminSensitiveWord]
      summary: 分页查询敏感词
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: keyword
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [POLITICS, PORN, ABUSE, AD, CUSTOM]
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminSensitiveWordPage'
    post:
      tags: [AdminSensitiveWord]
      summary: 新增敏感词
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSensitiveWordSaveRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminSensitiveWord'
  /admin/sensitive-words/{id}:
    put:
      tags: [AdminSensitiveWord]
      summary: 更新敏感词
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSensitiveWordSaveRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminSensitiveWord'
    delete:
      tags: [AdminSensitiveWord]
      summary: 删除敏感词
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
  /admin/sensitive-words/{id}/status:
    patch:
      tags: [AdminSensitiveWord]
      summary: 启停敏感词
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: integer
                  enum: [0, 1]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminSensitiveWord'
  /admin/knowledge:
    get:
      tags: [AdminKnowledge]
      summary: 分页查询知识库
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: keyword
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminKnowledgePage'
    post:
      tags: [AdminKnowledge]
      summary: 传入知识（MySQL SSOT + 异步 RAG 灌库）
      description: |
        保存到 MySQL `admin_knowledge`，异步调用 MemeAgent `POST /ingest/knowledge`：
        LangChain RecursiveCharacterTextSplitter 切块 → Embedding → pgvector `knowledge_vector_chunk`。
        Agent 可通过工具 `search_admin_knowledge` 检索。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminKnowledgeSaveRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminKnowledge'
  /admin/knowledge/upload:
    post:
      tags: [AdminKnowledge]
      summary: 上传 Markdown / PDF 并灌库
      description: |
        multipart/form-data：`file`（必填，.md/.markdown/.pdf，≤15MB）、
        `title`（可选，默认文件名）、`category`、`tags`（逗号分隔）。
        服务端提取文本后写入 MySQL 并异步向量灌库。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                category:
                  type: string
                tags:
                  type: string
                  description: 逗号分隔标签
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminKnowledge'
  /admin/knowledge/{id}:
    get:
      tags: [AdminKnowledge]
      summary: 知识详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminKnowledge'
    put:
      tags: [AdminKnowledge]
      summary: 更新知识并重新灌库
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminKnowledgeSaveRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminKnowledge'
    delete:
      tags: [AdminKnowledge]
      summary: 删除知识（软删 + 删向量）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
  /admin/knowledge/{id}/reindex:
    post:
      tags: [AdminKnowledge]
      summary: 强制重新灌库
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAdminKnowledge'
  /ai/ops/status:
    get:
      tags: [AiOps]
      summary: 运维状态（Agent 健康与开关）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /ai/crawl/trigger:
    post:
      tags: [AiOps]
      summary: 触发热梗爬取并入库
      description: 可选 limit（1–20）；默认使用 meme.crawl.limit。
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: OK
  /ai/ingest/backfill:
    post:
      tags: [AiOps]
      summary: 向量回填（已发布梗）
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /ai/ingest/sync/{memeId}:
    post:
      tags: [AiOps]
      summary: 同步单条梗向量
      security:
        - bearerAuth: []
      parameters:
        - name: memeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /ai/ingest/approve/{memeId}:
    post:
      tags: [AiOps]
      summary: 审核通过并灌库
      security:
        - bearerAuth: []
      parameters:
        - name: memeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /oss/policy:
    get:
      tags: [Auth]
      summary: OSS 直传凭证（fileType=home 仅管理员）
      security:
        - bearerAuth: []
      parameters:
        - name: fileType
          in: query
          schema:
            type: string
            enum: [avatar, meme, comment, home]
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    size:
      name: size
      in: query
      schema:
        type: integer
        default: 10
        maximum: 50
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    ResultBase:
      type: object
      properties:
        code:
          type: integer
          example: 1
        message:
          type: string
        data: {}
    LoginRequestDTO:
      type: object
      required: [email, password, loginType, captchaId, captchaCode]
      properties:
        email:
          type: string
        password:
          type: string
        loginType:
          type: string
          example: email
        captchaId:
          type: string
        captchaCode:
          type: string
    LoginUserVO:
      type: object
      properties:
        id:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        signature:
          type: string
        role:
          type: string
        status:
          type: integer
    LoginResponseVO:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/LoginUserVO'
    ResultLogin:
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginResponseVO'
    ResultCaptcha:
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                captchaId:
                  type: string
                imageBase64:
                  type: string
                expireSeconds:
                  type: integer
    PageMeta:
      type: object
      properties:
        list:
          type: array
          items: {}
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
    AdminMemeListItemVO:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        introduction: { type: string }
        image: { type: string }
        status: { type: integer }
        statusDesc: { type: string }
        userId: { type: string }
        authorNickname: { type: string }
        pageViews: { type: integer }
        likes: { type: integer }
        comments: { type: integer }
        releaseTime: { type: string }
        updateTime: { type: string }
    AdminMemeActionVO:
      type: object
      properties:
        memeId: { type: string }
        status: { type: integer }
        statusDesc: { type: string }
    AdminUserListItemVO:
      type: object
      properties:
        id: { type: string }
        nickname: { type: string }
        avatar: { type: string }
        signature: { type: string }
        role: { type: string }
        status: { type: integer }
        createTime: { type: string }
        updateTime: { type: string }
    AdminHomeImageVO:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        imgUrl: { type: string }
        targetType: { type: integer }
        targetValue: { type: string }
        sortOrder: { type: integer }
        status: { type: integer }
        createTime: { type: string }
        updateTime: { type: string }
    AdminHomeImageSaveRequestDTO:
      type: object
      required: [imgUrl, targetType]
      properties:
        title: { type: string }
        imgUrl: { type: string }
        targetType: { type: integer, enum: [0, 1, 2] }
        targetValue: { type: string }
        sortOrder: { type: integer }
        status: { type: integer, enum: [0, 1] }
    AdminTagVO:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        relatedQuantity: { type: string }
    AdminTagSaveRequestDTO:
      type: object
      required: [name]
      properties:
        name: { type: string }
    AdminSensitiveWordVO:
      type: object
      properties:
        id: { type: string }
        word: { type: string }
        category: { type: string }
        actionType: { type: integer }
        status: { type: integer }
        creator: { type: string }
        createTime: { type: string }
        updateTime: { type: string }
    AdminSensitiveWordSaveRequestDTO:
      type: object
      required: [word, category, actionType]
      properties:
        word: { type: string }
        category: { type: string, enum: [POLITICS, PORN, ABUSE, AD, CUSTOM] }
        actionType: { type: integer, enum: [1, 2, 3] }
        status: { type: integer, enum: [0, 1] }
    ResultAdminMemePage:
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    list:
                      type: array
                      items:
                        $ref: '#/components/schemas/AdminMemeListItemVO'
    ResultAdminMemeDetail:
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AdminMemeListItemVO'
    ResultAdminMemeAction:
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AdminMemeActionVO'
    ResultAdminUserPage:
      allOf:
