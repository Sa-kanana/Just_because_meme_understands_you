# Compose 服务名 backend 会在 edge-net 中解析到 Spring Boot 容器。
upstream spring_backend {
    # Docker 的内置 DNS 会在后端容器重建后返回新的 IP。
    resolver 127.0.0.11 valid=10s ipv6=off;
    # DNS 查询的最长等待时间。
    resolver_timeout 5s;
    # 动态解析 upstream 需要共享内存区域，要求 Nginx 1.27.3 或以上。
    zone spring_backend 64k;
    # 持续按服务名解析后端地址，避免容器重建后仍连接旧 IP。
    server backend:8080 resolve;
    # 每个工作进程保留的上游空闲连接数。
    keepalive 32;
}

# 站点服务器托管用户端、管理端，并把同源 API 请求转发给 Java。
server {
    # 监听容器 HTTP 端口，宿主机端口由 Compose 的 HTTP_PORT 决定。
    listen 80 default_server;
    # 允许服务器 IP 或后续绑定的站点域名访问。
    server_name _;

    # 用户端静态资源根目录，管理端位于其 admin 子目录。
    root /usr/share/nginx/html;
    # 目录请求默认打开 SPA 入口。
    index index.html;
    # 接收后端 25 MiB 知识文件以及 multipart 表单开销。
    client_max_body_size 30m;

    # /api/foo 转发为 Spring Boot 的 /foo，保持前端同源请求方式。
    location ^~ /api/ {
        # 上游使用 HTTP/1.1，以支持长连接和 SSE。
        proxy_http_version 1.1;
        # 保留浏览器原始 Host，包含非默认端口。
        proxy_set_header Host $http_host;
        # 记录经过当前 Nginx 的客户端地址。
        proxy_set_header X-Real-IP $remote_addr;
        # 当前 Nginx 是唯一公网入口，覆盖客户端伪造的转发地址以保护 IP 限流。
        proxy_set_header X-Forwarded-For $remote_addr;
        # 清除客户端自带的 RFC 7239 转发头，避免 Spring 优先读取伪造地址。
        proxy_set_header Forwarded "";
        # 清除客户端自带的转发端口，由公开 Host 中的端口确定访问地址。
        proxy_set_header X-Forwarded-Port "";
        # 清除客户端自带的转发前缀，不改变 Spring 内部的接口路径。
        proxy_set_header X-Forwarded-Prefix "";
        # 将站点公开 Host 与端口传递给 Spring。
        proxy_set_header X-Forwarded-Host $http_host;
        # 传递当前入口协议；启用 HTTPS 后由 TLS 入口正确设置。
        proxy_set_header X-Forwarded-Proto $scheme;
        # 不把客户端 Connection 逐跳头传给上游。
        proxy_set_header Connection "";

        # 允许知识向量索引和 AI 流式请求等待较长时间。
        proxy_connect_timeout 10s;
        # 向上游发送请求时允许的相邻写入空闲时间。
        proxy_send_timeout 1200s;
        # 读取上游响应时允许的相邻事件空闲时间。
        proxy_read_timeout 1200s;

        # 禁用代理缓冲，确保 SSE 片段及时送到浏览器。
        proxy_buffering off;
        # 流式转发上传请求正文。
        proxy_request_buffering off;
        # 不缓存用户 API 和 AI 响应。
        proxy_cache off;
        # SSE 支持分块传输。
        chunked_transfer_encoding on;
        # 告知后续兼容代理不缓冲响应。
        add_header X-Accel-Buffering no;

        # 末尾斜杠会移除 /api 前缀后再访问 Spring Boot。
        proxy_pass http://spring_backend/;
    }

    # 统一补齐 API 末尾斜杠，避免 Nginx 路径匹配歧义。
    location = /api {
        return 301 /api/;
    }

    # 管理端 Vue SPA 使用 /admin/ 作为资源根路径。
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 将无斜杠管理端地址规范到管理端 SPA 根路径。
    location = /admin {
        return 301 /admin/;
    }

    # SPA 入口不缓存，更新部署后浏览器能获得最新构建的资源地址。
    location ~ (?:^|/)index\.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    # 构建后的脚本与样式允许短期缓存；不存在的资源返回 404，避免误返回 SPA HTML。
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 用户端 Vue SPA 的 History 路由回退。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
