# Compose 服务名 backend 会在 edge-net 中解析到 Spring Boot 容器。
upstream spring_backend {
    server backend:8080;
    keepalive 32;
}

# 站点服务器托管用户端、管理端，并把同源 API 请求转发给 Java。
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    # /api/foo 转发为 Spring Boot 的 /foo，保持前端同源请求方式。
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 允许知识向量索引和 AI 流式请求等待较长时间。
        proxy_connect_timeout 10s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;

        # 禁用代理缓冲，确保 SSE 片段及时送到浏览器。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        # 末尾斜杠会移除 /api 前缀后再访问 Spring Boot。
        proxy_pass http://spring_backend/;
    }

    # 统一补齐 API 末尾斜杠，避免 Nginx 路径匹配歧义。
    location = /api {
        return 301 /api/;
    }

    # 管理端 Vue SPA 使用 /admin/ 作为资源根路径。
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 将无斜杠管理端地址规范到管理端 SPA 根路径。
    location = /admin {
        return 301 /admin/;
    }

    # 用户端 Vue SPA 的 History 路由回退。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
