# 按容器可见 CPU 数量分配工作进程。
worker_processes auto;
# 错误日志等级；官方镜像中的日志路径连接到标准错误。
error_log /var/log/nginx/error.log warn;
# Nginx 主进程 PID 文件路径。
pid /var/run/nginx.pid;

events {
    # 每个工作进程允许的连接数；代理连接也计入该值。
    worker_connections 1024;
}

http {
    # 加载静态资源 MIME 类型映射。
    include       /etc/nginx/mime.types;
    # 未匹配扩展名时使用二进制类型。
    default_type  application/octet-stream;

    # 请求日志格式，记录上游地址，便于定位 API 502 和路由问题。
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr';

    # 访问日志输出；官方镜像中的日志路径连接到标准输出。
    access_log /var/log/nginx/access.log main;

    # 静态文件通过内核直接发送。
    sendfile        on;
    # 合并文件发送数据包以减少网络开销。
    tcp_nopush      on;
    # 浏览器空闲长连接保留秒数。
    keepalive_timeout 65;
    # 与站点配置统一，覆盖后端 25 MiB 文件及 multipart 边界开销。
    client_max_body_size 30m;

    # 压缩 HTML、样式、脚本和 JSON，适配服务器有限的公网带宽。
    gzip on;
    # 代理缓存依据浏览器接受压缩的能力区分响应。
    gzip_vary on;
    # 小于 1 KiB 的内容不压缩。
    gzip_min_length 1024;
    # 不包含 text/event-stream，避免压缩缓冲影响 AI SSE。
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SSE / 长连接：关闭代理缓冲
    proxy_buffering off;
    # 不把上传请求正文完整写入磁盘后再发送给后端。
    proxy_request_buffering off;

    # 加载用户端、管理端和同源 API 的站点配置。
    include /etc/nginx/conf.d/*.conf;
}
