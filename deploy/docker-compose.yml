# 单机生产部署拓扑：数据库、Java、FastAPI 与 Nginx 均由本文件统一启动。
name: just-because-meme

services:
  # 业务数据库；首次初始化时导入项目当前基线结构，后续结构变化由 Flyway 管理。
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # 初始化业务库名称；mysql.sql 基线也固定使用 meme。
      MYSQL_DATABASE: meme
      # MySQL root 管理密码，只用于容器初始化和运维。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 中设置 MYSQL_ROOT_PASSWORD}
      # Spring Boot 使用的专用数据库账号。
      MYSQL_USER: ${MYSQL_APP_USER:-meme_app}
      # Spring Boot 专用账号密码，Flyway 会使用此账号执行迁移。
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?请在 deploy/.env 中设置 MYSQL_APP_PASSWORD}
      # 让数据库日志和函数时间使用服务器常用时区。
      TZ: Asia/Shanghai
    volumes:
      # 保留 MySQL 数据，普通 down/up 不会删除此卷。
      - mysql-data:/var/lib/mysql
      # 空数据卷首次创建时导入仓库当前基线表；MySQL 只会执行一次。
      - ../just_because_meme_understands_you-backend/src/main/resources/db/mysql.sql:/docker-entrypoint-initdb.d/001-meme-schema.sql:ro
    healthcheck:
      # 等待 MySQL 接受本地连接后，再启动依赖服务。
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      # 数据库启动初期每 10 秒检查一次。
      interval: 10s
      # 单次探活最多等待 5 秒。
      timeout: 5s
      # 连续失败 12 次后标记为不健康。
      retries: 12
      # 允许数据库完成首次初始化的预热时间。
      start_period: 40s
    networks:
      # 数据库仅接入内部数据网络，不映射公网端口。
      - data-net

  # 限流与缓存使用的 Redis，启用 AOF 并设置访问密码。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      # Redis 密码由 deploy/.env 提供，不写入镜像或 Compose 文件。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      # 持久化 Redis AOF 文件，容器重建后保留缓存数据。
      - redis-data:/data
    healthcheck:
      # 使用 RedisCLI_AUTH 避免把密码作为命令行参数传递。
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      # Redis 启动后每 10 秒探活一次。
      interval: 10s
      # 单次 Redis 探活最多等待 5 秒。
      timeout: 5s
      # 连续失败 5 次后标记为不健康。
      retries: 5
      # Redis 初始加载 AOF 时允许 15 秒预热。
      start_period: 15s
    networks:
      # Redis 仅接入内部数据网络。
      - data-net

  # MemeAgent 的独立向量数据库，镜像内预装 pgvector 扩展。
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # PostgreSQL 业务账号；仅供 MemeAgent 内部连接。
      POSTGRES_USER: ${POSTGRES_USER:-memeagent}
      # PostgreSQL 数据库密码，同时用于向量连接 URL。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 中设置 POSTGRES_PASSWORD}
      # 独立向量库名称，与 MySQL 业务库分离。
      POSTGRES_DB: ${POSTGRES_DB:-memeagent_vector}
      # PostgreSQL 容器采用中国标准时间。
      TZ: Asia/Shanghai
    volumes:
      # 持久化 HNSW 向量与知识库索引。
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # 等待数据库接受向量服务连接。
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      # PostgreSQL 每 10 秒探活一次。
      interval: 10s
      # 单次探活最多等待 5 秒。
      timeout: 5s
      # 连续失败 6 次后标记为不健康。
      retries: 6
      # 首次初始化允许 20 秒预热。
      start_period: 20s
    networks:
      # PostgreSQL 只接入内部数据网络。
      - data-net

  # Python FastAPI 检索与生成服务。
  meme-agent:
    build:
      # 以仓库根目录为构建上下文，读取 MemeAgent 源码。
      context: ..
      # 使用 Python 3.11 多阶段运行镜像。
      dockerfile: deploy/Dockerfile.agent
    restart: unless-stopped
    environment:
      # 运行环境关闭开发文档页面。
      APP_ENV: prod
      # FastAPI 在容器网卡上监听，供 Spring Boot 内网访问。
      APP_HOST: 0.0.0.0
      # FastAPI 容器内端口。
      APP_PORT: "8000"
      # FastAPI 日志级别。
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Java 与 MemeAgent 之间的内部鉴权密钥。
      INTERNAL_API_KEY: ${MEME_AGENT_API_KEY:?请在 deploy/.env 中设置 MEME_AGENT_API_KEY}
      # 写入接口独立密钥；未配置时回退到内部鉴权密钥。
      INTERNAL_API_KEY_WRITE: ${MEME_AGENT_WRITE_API_KEY:-}
      # 构造 PostgreSQL 内网连接地址；密码请使用 openssl rand -hex 生成。
      VECTOR_DATABASE_URL: postgresql://${POSTGRES_USER:-memeagent}:${POSTGRES_PASSWORD:?请在 deploy/.env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memeagent_vector}
      # 向量维度必须与当前 embedding 模型输出一致。
      VECTOR_EMBEDDING_DIM: ${VECTOR_EMBEDDING_DIM:-1024}
      # 梗向量检索的最低余弦相似度。
      VECTOR_MIN_SIMILARITY: ${VECTOR_MIN_SIMILARITY:-0.6322177756757377}
      # 每个服务进程的 PostgreSQL 最小连接数。
      VECTOR_POOL_MIN_SIZE: ${VECTOR_POOL_MIN_SIZE:-1}
      # 每个服务进程的 PostgreSQL 最大连接数。
      VECTOR_POOL_MAX_SIZE: ${VECTOR_POOL_MAX_SIZE:-10}
      # 获取 PostgreSQL 连接的最长等待秒数。
      VECTOR_POOL_ACQUIRE_TIMEOUT_SECONDS: ${VECTOR_POOL_ACQUIRE_TIMEOUT_SECONDS:-5}
      # 单条 PostgreSQL 命令超时秒数。
      VECTOR_DB_COMMAND_TIMEOUT_SECONDS: ${VECTOR_DB_COMMAND_TIMEOUT_SECONDS:-30}
      # 查询 embedding 缓存最大条数。
      EMBEDDING_CACHE_MAX_ENTRIES: ${EMBEDDING_CACHE_MAX_ENTRIES:-128}
      # 查询 embedding 缓存过期秒数。
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-300}
      # OpenAI 兼容 API 密钥。
      OPENAI_API_KEY: ${OPENAI_API_KEY:?请在 deploy/.env 中设置 OPENAI_API_KEY}
      # OpenAI 兼容 API 地址；留空时使用 SDK 默认地址。
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # 对话模型名称。
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      # 向量 embedding 模型名称。
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-qwen3.7-text-embedding-flash}
      # 单次模型请求超时秒数。
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-35}
      # 模型调用失败后额外重试次数。
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      # 是否请求流式 token 使用量统计。
      LLM_STREAM_USAGE: ${LLM_STREAM_USAGE:-false}
      # 是否启用 LangSmith 追踪。
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      # LangSmith 追踪 API 密钥。
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      # LangSmith 项目名称。
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-memeagent}
      # 向量检索候选数量上限。
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      # 单次检索超时秒数。
      RETRIEVAL_TIMEOUT_SECONDS: ${RETRIEVAL_TIMEOUT_SECONDS:-12}
      # 检索失败后额外重试次数。
      RETRIEVAL_MAX_RETRIES: ${RETRIEVAL_MAX_RETRIES:-1}
      # 会话检索词改写最长等待秒数。
      RETRIEVAL_QUERY_REWRITE_TIMEOUT_SECONDS: ${RETRIEVAL_QUERY_REWRITE_TIMEOUT_SECONDS:-5}
      # 管理知识纯向量召回相似度下限；留空表示关闭纯向量候选。
      ADMIN_KNOWLEDGE_MIN_SIMILARITY: ${ADMIN_KNOWLEDGE_MIN_SIMILARITY:-}
      # 知识库切块的单片字符数。
      KNOWLEDGE_CHUNK_SIZE: ${KNOWLEDGE_CHUNK_SIZE:-1000}
      # 相邻知识片段的重叠字符数。
      KNOWLEDGE_CHUNK_OVERLAP: ${KNOWLEDGE_CHUNK_OVERLAP:-160}
      # 单份知识正文最大字符数。
      KNOWLEDGE_MAX_CONTENT_CHARS: ${KNOWLEDGE_MAX_CONTENT_CHARS:-1000000}
      # 知识向量 embedding 并行批次数。
      KNOWLEDGE_EMBEDDING_BATCH_CONCURRENCY: ${KNOWLEDGE_EMBEDDING_BATCH_CONCURRENCY:-2}
      # 未完成知识索引检查点保留天数。
      KNOWLEDGE_EMBEDDING_CHECKPOINT_TTL_DAYS: ${KNOWLEDGE_EMBEDDING_CHECKPOINT_TTL_DAYS:-7}
      # 搜索 Agent 整体请求最长秒数。
      AGENT_TOTAL_TIMEOUT_SECONDS: ${AGENT_TOTAL_TIMEOUT_SECONDS:-120}
      # 是否启用 Firecrawl 热梗采集。
      FIRECRAWL_ENABLED: ${FIRECRAWL_ENABLED:-false}
      # Firecrawl API 密钥。
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      # 单次 Firecrawl 采集最长秒数。
      FIRECRAWL_CRAWL_TOTAL_TIMEOUT_SECONDS: ${FIRECRAWL_CRAWL_TOTAL_TIMEOUT_SECONDS:-150}
      # B 站投稿页地址。
      FIRECRAWL_BILIBILI_UPLOAD_URL: ${FIRECRAWL_BILIBILI_UPLOAD_URL:-https://space.bilibili.com/94510621/upload/video}
      # B 站投稿页采集视频数量。
      FIRECRAWL_BILIBILI_TOP_VIDEOS: ${FIRECRAWL_BILIBILI_TOP_VIDEOS:-5}
      # Firecrawl 页面抓取代理模式。
      FIRECRAWL_SCRAPE_PROXY: ${FIRECRAWL_SCRAPE_PROXY:-stealth}
      # B 站主页动态地址。
      FIRECRAWL_BILIBILI_DYNAMIC_URL: ${FIRECRAWL_BILIBILI_DYNAMIC_URL:-https://space.bilibili.com/94510621}
      # Firecrawl 追加抓取地址列表。
      FIRECRAWL_BILIBILI_EXTRA_URLS: ${FIRECRAWL_BILIBILI_EXTRA_URLS:-https://space.bilibili.com/94510621/dynamic}
      # 采集无结果时的站内兜底查询词，以竖线分隔。
      FIRECRAWL_DEFAULT_QUERIES: ${FIRECRAWL_DEFAULT_QUERIES:-网络流行语|网络梗}
      # FastAPI 收到停止信号后等待在途请求的秒数。
      UVICORN_GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS: ${UVICORN_GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS:-5}
    depends_on:
      # 等待向量数据库完成启动后再初始化向量 schema。
      postgres:
        condition: service_healthy
    healthcheck:
      # 使用 Python 标准库检查公开健康端点及向量数据库连接状态。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      # FastAPI 每 15 秒检查一次。
      interval: 15s
      # 单次探活最多等待 8 秒。
      timeout: 8s
      # 连续失败 5 次后标记为不健康。
      retries: 5
      # 等待向量 schema 初始化与模型配置加载。
      start_period: 45s
    networks:
      # Java 服务通过 service-net 调用 FastAPI。
      - service-net
      # FastAPI 通过 data-net 连接 PostgreSQL。
      - data-net

  # Spring Boot 单实例；结构迁移由 Spring 启动时的 Flyway 自动执行。
  backend:
    build:
      # 以仓库根目录为构建上下文，读取 Java 模块源码。
      context: ..
      # 使用 Java 17 多阶段构建 Dockerfile。
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      # 激活生产配置文件。
      SPRING_PROFILES_ACTIVE: prod
      # 限定 Java 堆内存，避免单实例在无容器内存限制时占满整台服务器。
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1024m -XX:+UseContainerSupport}
      # Spring Boot 容器监听端口。
      SERVER_PORT: "8080"
      # 业务 MySQL JDBC 连接地址，固定连接项目库 meme。
      DB_URL: "jdbc:mysql://mysql:3306/meme?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
      # Spring Boot 的 MySQL 专用账号。
      DB_USERNAME: ${MYSQL_APP_USER:-meme_app}
      # Spring Boot 的 MySQL 专用密码。
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?请在 deploy/.env 中设置 MYSQL_APP_PASSWORD}
      # Redis 容器服务名。
      REDIS_HOST: redis
      # Redis 容器内端口。
      REDIS_PORT: "6379"
      # Redis 访问密码。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}
      # SMTP 邮件服务器域名。
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      # SMTP SSL 端口。
      MAIL_PORT: ${MAIL_PORT:-465}
      # SMTP 邮箱账号。
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      # SMTP 邮箱授权码。
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # OSS 服务地域端点。
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      # OSS 访问密钥 ID。
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?请在 deploy/.env 中设置 OSS_ACCESS_KEY_ID}
      # OSS 访问密钥 Secret。
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?请在 deploy/.env 中设置 OSS_ACCESS_KEY_SECRET}
      # OSS Bucket 名称。
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:?请在 deploy/.env 中设置 OSS_BUCKET_NAME}
      # OSS 浏览器直传地址；未使用自定义域名时留空。
      OSS_UPLOAD_HOST: ${OSS_UPLOAD_HOST:-}
      # OSS 图片公开访问基址；未使用自定义域名时留空。
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
      # JWT 签名密钥，至少 32 字节。
      JWT_SECRET: ${JWT_SECRET:?请在 deploy/.env 中设置 JWT_SECRET}
      # HTTP 部署关闭 Secure Cookie；启用 HTTPS 后应改为 true。
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      # JWT access token 有效期毫秒。
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7200000}
      # JWT refresh token 有效期毫秒。
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      # 同源 Nginx 代理下关闭跨域校验。
      CORS_ENABLED: ${CORS_ENABLED:-false}
      # Spring 配置即使关闭 CORS 也需要一个允许来源值。
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      # 可选的 CORS 通配来源规则。
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      # 是否启用安全响应头。
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      # HTTP 默认关闭 HSTS；HTTPS 部署时应改为 true。
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      # 反馈邮件收件地址。
      FEEDBACK_TO_EMAIL: ${FEEDBACK_TO_EMAIL:-}
      # 单 IP 每分钟允许的反馈次数。
      FEEDBACK_RATE_LIMIT_PER_MINUTE: ${FEEDBACK_RATE_LIMIT_PER_MINUTE:-3}
      # GitHub OAuth 应用 Client ID。
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      # GitHub OAuth 应用 Client Secret。
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # GitHub OAuth 回调地址，需在 OAuth App 中填写同一个地址。
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost/api/v1/auth/oauth/github/callbacks}
      # OAuth 登录成功后前端接收回调的地址。
      GITHUB_FRONTEND_CALLBACK_URL: ${GITHUB_FRONTEND_CALLBACK_URL:-http://localhost/login/oauth/callback}
      # GitHub OAuth 请求权限范围。
      GITHUB_OAUTH_SCOPE: ${GITHUB_OAUTH_SCOPE:-read:user user:email}
      # 首次启动时可选地将已有邮箱提升为超级管理员。
      AUTH_BOOTSTRAP_SUPER_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      # FastAPI 容器服务名及内部端口。
      MEME_AGENT_BASE_URL: http://meme-agent:8000
      # Java 调用 FastAPI 的内部鉴权密钥。
      MEME_AGENT_API_KEY: ${MEME_AGENT_API_KEY:?请在 deploy/.env 中设置 MEME_AGENT_API_KEY}
      # FastAPI 写接口单独鉴权密钥；空值时复用主密钥。
      MEME_AGENT_WRITE_API_KEY: ${MEME_AGENT_WRITE_API_KEY:-}
      # Java 建立 FastAPI 连接的最长等待毫秒数。
      MEME_AGENT_CONNECT_TIMEOUT_MS: ${MEME_AGENT_CONNECT_TIMEOUT_MS:-2000}
      # Java 读取 FastAPI 响应的最长等待毫秒数。
      MEME_AGENT_RESPONSE_TIMEOUT_MS: ${MEME_AGENT_RESPONSE_TIMEOUT_MS:-1200000}
      # Java 到 FastAPI 的最大活动连接数。
      MEME_AGENT_MAX_CONNECTIONS: ${MEME_AGENT_MAX_CONNECTIONS:-100}
      # Java 等待 FastAPI 上游连接的排队数量上限。
      MEME_AGENT_PENDING_ACQUIRE_MAX_COUNT: ${MEME_AGENT_PENDING_ACQUIRE_MAX_COUNT:-200}
      # Java 等待上游连接的最长毫秒数。
      MEME_AGENT_PENDING_ACQUIRE_TIMEOUT_MS: ${MEME_AGENT_PENDING_ACQUIRE_TIMEOUT_MS:-10000}
      # 向量知识索引并发任务数。
      MEME_AGENT_KNOWLEDGE_INDEX_CONCURRENCY: ${MEME_AGENT_KNOWLEDGE_INDEX_CONCURRENCY:-2}
      # AI 对话上下文最大 token 估算值。
      MEME_AI_MAX_HISTORY_TOKENS: ${MEME_AI_MAX_HISTORY_TOKENS:-3000}
      # AI 回答最大 token 数。
      MEME_AI_MAX_OUTPUT_TOKENS: ${MEME_AI_MAX_OUTPUT_TOKENS:-512}
      # AI 结果缓存有效秒数。
      MEME_AI_CACHE_TTL_SECONDS: ${MEME_AI_CACHE_TTL_SECONDS:-120}
      # AI SSE 相邻事件允许的最长空闲毫秒数。
      MEME_AI_STREAM_IDLE_TIMEOUT_MS: ${MEME_AI_STREAM_IDLE_TIMEOUT_MS:-130000}
      # 后台生成任务及事件保留秒数。
      MEME_AI_TASK_TTL_SECONDS: ${MEME_AI_TASK_TTL_SECONDS:-600}
      # AI 搜索单用户每分钟请求上限。
      MEME_AI_RATE_LIMIT_PER_MINUTE: ${MEME_AI_RATE_LIMIT_PER_MINUTE:-20}
      # 按字符估算 token 时每个 token 的平均字符数。
      MEME_AI_CHARS_PER_TOKEN: ${MEME_AI_CHARS_PER_TOKEN:-3}
      # 管理端知识文件最大上传体积。
      KNOWLEDGE_UPLOAD_MAX_FILE_SIZE: ${KNOWLEDGE_UPLOAD_MAX_FILE_SIZE:-25MB}
      # 管理端知识正文最大字符数。
      KNOWLEDGE_UPLOAD_MAX_CONTENT_CHARS: ${KNOWLEDGE_UPLOAD_MAX_CONTENT_CHARS:-1000000}
      # 知识文件同时解析的请求数上限。
      KNOWLEDGE_UPLOAD_MAX_CONCURRENT_REQUESTS: ${KNOWLEDGE_UPLOAD_MAX_CONCURRENT_REQUESTS:-2}
      # 知识文件上传等待并发槽位的最长毫秒数。
      KNOWLEDGE_UPLOAD_ADMISSION_WAIT_MS: ${KNOWLEDGE_UPLOAD_ADMISSION_WAIT_MS:-30000}
      # OSS 临时文件生命周期清理开关。
      OSS_CLEANUP_ENABLED: ${OSS_CLEANUP_ENABLED:-true}
      # OSS 文件清理任务每批处理对象数。
      OSS_CLEANUP_BATCH_SIZE: ${OSS_CLEANUP_BATCH_SIZE:-100}
      # OSS 文件清理任务轮询间隔毫秒。
      OSS_CLEANUP_POLL_INTERVAL_MS: ${OSS_CLEANUP_POLL_INTERVAL_MS:-60000}
      # 删除数据库资产记录前的延迟天数。
      OSS_CLEANUP_DELETION_DELAY_DAYS: ${OSS_CLEANUP_DELETION_DELAY_DAYS:-2}
      # OSS 文件清理失败的最大重试次数。
      OSS_CLEANUP_MAX_RETRIES: ${OSS_CLEANUP_MAX_RETRIES:-5}
      # OSS 清理任务分布式租约秒数。
      OSS_CLEANUP_LEASE_SECONDS: ${OSS_CLEANUP_LEASE_SECONDS:-300}
      # 是否启用存量 OSS 文件资产回填。
      OSS_BACKFILL_ENABLED: ${OSS_BACKFILL_ENABLED:-true}
      # OSS 资产回填任务每批处理对象数。
      OSS_BACKFILL_BATCH_SIZE: ${OSS_BACKFILL_BATCH_SIZE:-200}
      # OSS 资产回填任务轮询间隔毫秒。
      OSS_BACKFILL_POLL_INTERVAL_MS: ${OSS_BACKFILL_POLL_INTERVAL_MS:-1000}
      # OSS 资产回填任务分布式租约秒数。
      OSS_BACKFILL_LEASE_SECONDS: ${OSS_BACKFILL_LEASE_SECONDS:-300}
      # OSS 临时对象每日清理 Cron 表达式。
      OSS_TEMP_CLEANUP_CRON: ${OSS_TEMP_CLEANUP_CRON:-0 0 3 * * *}
      # OSS 清理任务工作节点标识，留空时由应用生成。
      OSS_CLEANUP_WORKER_ID: ${OSS_CLEANUP_WORKER_ID:-}
      # OSS 临时对象允许保留的天数。
      OSS_TEMP_ASSET_TTL_DAYS: ${OSS_TEMP_ASSET_TTL_DAYS:-3}
      # OSS 孤儿对象人工复核天数。
      OSS_ORPHAN_REVIEW_DAYS: ${OSS_ORPHAN_REVIEW_DAYS:-7}
      # OSS 对账默认先运行在只读预览模式。
      OSS_RECONCILE_DRY_RUN: ${OSS_RECONCILE_DRY_RUN:-true}
      # OSS 对账任务默认关闭，确认配置后再开启。
      OSS_RECONCILE_ENABLED: ${OSS_RECONCILE_ENABLED:-false}
      # OSS 全量对账任务 Cron 表达式。
      OSS_RECONCILE_CRON: ${OSS_RECONCILE_CRON:-0 30 3 * * *}
      # OSS 对账分页大小。
      OSS_RECONCILE_PAGE_SIZE: ${OSS_RECONCILE_PAGE_SIZE:-500}
      # OSS 直传签名策略每 IP 每分钟限额。
      OSS_POLICY_RATE_LIMIT_PER_MINUTE: ${OSS_POLICY_RATE_LIMIT_PER_MINUTE:-10}
      # 是否启用管理员向量任务需要管理员权限。
      MEME_OPS_REQUIRE_ADMIN: ${MEME_OPS_REQUIRE_ADMIN:-true}
      # 是否启用定时热梗采集；默认关闭，避免未配置 Firecrawl 时持续失败。
      MEME_CRAWL_ENABLED: ${MEME_CRAWL_ENABLED:-false}
      # 是否启用热梗定时任务。
      MEME_CRAWL_SCHEDULE_ENABLED: ${MEME_CRAWL_SCHEDULE_ENABLED:-false}
      # 热梗采集定时表达式。
      MEME_CRAWL_CRON: ${MEME_CRAWL_CRON:-0 0 10 1,8,15,22 * *}
      # 单次热梗采集的梗数量上限。
      MEME_CRAWL_LIMIT: ${MEME_CRAWL_LIMIT:-5}
      # 发布采集结果所用的系统用户 ID。
      MEME_CRAWL_PUBLISHER_USER_ID: ${MEME_CRAWL_PUBLISHER_USER_ID:-0}
      # 定时采集候选梗数量上限。
      MEME_CRAWL_LIVE_LIMIT: ${MEME_CRAWL_LIVE_LIMIT:-8}
      # 定时采集候选梗的最大时间跨度小时数。
      MEME_CRAWL_LIVE_HOURS: ${MEME_CRAWL_LIVE_HOURS:-48}
    depends_on:
      # 只有 MySQL、Redis 和 FastAPI 均健康后才启动 Java。
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meme-agent:
        condition: service_healthy
    healthcheck:
      # 检查 Spring Boot 是否已返回 HTTP 响应；404 也表示 HTTP 服务已就绪。
      test: ["CMD-SHELL", "curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ | grep -Eq '^[1-5][0-9][0-9]$'"]
      # Spring Boot 每 15 秒探活一次。
      interval: 15s
      # 单次探活最多等待 10 秒。
      timeout: 10s
      # 连续失败 5 次后标记为不健康。
      retries: 5
      # 留出 Flyway 执行迁移和应用启动时间。
      start_period: 120s
    stop_grace_period: 45s
    networks:
      # Nginx 通过 edge-net 反向代理到 Java。
      - edge-net
      # Java 通过 service-net 连接 FastAPI。
      - service-net
      # Java 通过 data-net 连接 MySQL 和 Redis。
      - data-net

  # Nginx 是唯一映射到服务器端口的容器，同时托管用户端和管理端 Vue 页面。
  nginx:
    build:
      # 以仓库根目录为构建上下文，读取两个 Vue 模块和 Nginx 配置。
      context: ..
      # 使用 Node 多阶段构建前端，再复制到 Nginx 镜像。
      dockerfile: deploy/Dockerfile.nginx
    restart: unless-stopped
    ports:
      # 唯一公开入口；可在 deploy/.env 中设置 HTTP_PORT 改变宿主机端口。
      - "${HTTP_PORT:-80}:80"
    depends_on:
      # 等待 Spring Boot 健康后再接收页面 API 请求。
      backend:
        condition: service_healthy
    healthcheck:
      # 检查 Nginx 首页是否可以通过本机 HTTP 访问。
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      # Nginx 每 15 秒探活一次。
      interval: 15s
      # 单次探活最多等待 5 秒。
      timeout: 5s
      # 连续失败 3 次后标记为不健康。
      retries: 3
      # 前端构建结束后即可进行探活。
      start_period: 10s
    networks:
      # Nginx 只接入 Web 网络，无法直连数据库或 FastAPI。
      - edge-net

# 命名卷用于保存数据库数据，容器重建时不会丢失。
volumes:
  # MySQL 业务数据卷。
  mysql-data:
  # Redis AOF 数据卷。
  redis-data:
  # PostgreSQL/pgvector 数据卷。
  postgres-data:

# 网络分层限制 Nginx 只访问 Java，数据库不发布宿主机端口。
networks:
  # Web 接入网络，仅 Nginx 和 Spring Boot 使用。
  edge-net:
    driver: bridge
  # Java 与 FastAPI 的服务网络。
  service-net:
    driver: bridge
  # 数据库网络设为 internal，避免数据库容器直接访问外部网络。
  data-net:
    driver: bridge
    internal: true
